# 球団の系譜（franchise）と、時期ごとの名前。
#
# - `short` は NPB「プロ野球在籍者名簿」の在籍球団欄に出る表記そのもの。取り込み時は
#   (short, 年) の組で franchise を引く。同じ short が別系譜で使われた例
#   （1941-42 の「大洋」＝大洋軍 と 1950- の大洋ホエールズ、1943 の「西鉄」＝西鉄軍 と 1950- の西鉄）
#   があるので、必ず年とセットで引くこと。
# - 色は球団名の横の小さな印と経歴の帯だけに使う（背景には使わない）。現行 12 球団の色は
#   basecamp/app/lib/npb-teams.ts・globals.css と同じ値。消滅球団は中立の色。
# - 現行 12 球団の full / urlCode は NPB 公示の表記（例: 読売ジャイアンツ, registered_g.html の g）。
#   oldUrlCodes は過去の公示 URL の球団コード（2003〜2015 年度ごろ: 横浜 yb、オリックス bs・bw、近鉄 bu）。
franchises:
  - id: giants
    league: central
    full: 読売ジャイアンツ
    urlCode: g
    color: "#ED7006"
    colorDark: "#F97709"
    eras:
      - { short: 巨人, from: 1936 }

  - id: tigers
    league: central
    full: 阪神タイガース
    urlCode: t
    color: "#A49100"
